[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-statusline"
version = "0.8.0"
description = "A packaged, configurable, stateful Claude Code status line for Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
claude-statusline = "claude_statusline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_statusline = [
  "resources/statusline-config/SKILL.md",
  "resources/statusline-configure/SKILL.md",
]
