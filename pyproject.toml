[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-statusline"
version = "1.3.0a2"
description = "A configurable, stateful Claude Code status line for Linux, Windows and macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "fbincon"}]
requires-python = ">=3.10"
dependencies = [
  "windows-curses>=2.4.2; sys_platform == 'win32'",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/fbincon/claude-code-statusline"
Issues = "https://github.com/fbincon/claude-code-statusline/issues"
Documentation = "https://github.com/fbincon/claude-code-statusline#readme"
Changelog = "https://github.com/fbincon/claude-code-statusline/blob/main/CHANGELOG.md"
Releases = "https://github.com/fbincon/claude-code-statusline/releases"

[project.scripts]
claude-statusline = "claude_statusline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_statusline = [
  "resources/statusline-config/SKILL.md",
  "resources/statusline-configure/SKILL.md",
]

[tool.setuptools.cmdclass]
build_py = "build_native.BuildPy"
