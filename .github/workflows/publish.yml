name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag (also select this tag as the workflow ref)
        required: true
        type: string
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify Release assets and acceptance gates
    if: github.repository == 'fbincon/claude-code-statusline'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      upload_required: ${{ steps.verify.outputs.upload_required }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      INDEX_TARGET: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install twine 'readme-renderer[md]'
      - name: Download and verify the fixed Release assets
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/publish_package.py prepare
          --tag "$RELEASE_TAG" --target "$INDEX_TARGET"
          --dist dist --evidence verification/evidence.json
      - name: Store distributions that still need upload
        if: steps.verify.outputs.upload_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true
      - name: Store verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification
          path: verification/evidence.json
          if-no-files-found: error
          overwrite: true

  publish:
    name: Upload verified distributions
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/project/fbincon-claude-code-statusline/' || 'https://test.pypi.org/project/fbincon-claude-code-statusline/' }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        if: needs.prepare.outputs.upload_required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-distributions
          path: dist/
      - name: Publish with the environment's trusted identity
        if: needs.prepare.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: dist/

  verify-index:
    name: Index install / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: [prepare, publish]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.10', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      INDEX_TARGET: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare POSIX smoke prerequisites
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install tmux
            else
              sudo -n apt-get update
              sudo -n apt-get install -y tmux
            fi
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-verification
          path: verification/
      - name: Download, compare and install packages from the selected index
        shell: bash
        run: >-
          python tools/publish_package.py verify-index
          --target "$INDEX_TARGET" --evidence verification/evidence.json
          --dist index-packages --install --report index-installation.json
      - name: Store index installation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-${{ env.INDEX_TARGET }}-${{ matrix.os }}-${{ matrix.python }}
          path: index-installation.json
          overwrite: true
