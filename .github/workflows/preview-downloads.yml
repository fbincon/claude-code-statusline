name: Release public downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        default: v3.0.0

permissions:
  contents: read

jobs:
  downloads:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v3.')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify published bytes and fixed-version/channel installations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          release_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          npm run release:downloads -- --tag "$RELEASE_TAG" --commit "$release_commit" --verifier-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/public-downloads"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-downloads-${{ matrix.os }}
          path: ${{ runner.temp }}/public-downloads/public-downloads.json
          if-no-files-found: error
