name: Historical Python reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Frozen oracle, archived Python and mixed-runtime recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run reference:verify -- --python python --report '${{ runner.temp }}/reference.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ts05-historical-reference
          path: |
            ${{ runner.temp }}/reference.json
            ${{ runner.temp }}/reference-logs/
          if-no-files-found: error
