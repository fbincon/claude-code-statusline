name: Native Mod

on:
  push:
  pull_request:

jobs:
  mod:
    name: ${{ matrix.platform }} / Claude Code ${{ matrix.claude }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            claude: "2.1.287"
          - os: ubuntu-latest
            platform: Linux
            claude: "2.1.288"
          - os: ubuntu-latest
            platform: Linux
            claude: "2.1.289"
          - os: windows-latest
            platform: Windows
            claude: "2.1.288"
          - os: macos-15
            platform: macOS
            claude: "2.1.288"
          - os: windows-latest
            platform: Windows
            claude: "2.1.289"
          - os: macos-15
            platform: macOS
            claude: "2.1.289"
          - os: ubuntu-latest
            platform: Linux
            claude: "2.1.294"
          - os: windows-latest
            platform: Windows
            claude: "2.1.294"
          - os: macos-15
            platform: macOS
            claude: "2.1.294"
          - os: ubuntu-latest
            platform: Linux
            claude: "2.1.296"
          - os: windows-latest
            platform: Windows
            claude: "2.1.296"
          - os: macos-15
            platform: macOS
            claude: "2.1.296"
    defaults:
      run:
        shell: bash
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mods/statusline-native/package-lock.json
            mods/statusline-runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install fixed host and development dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-host" --no-audit --no-fund "@anthropic-ai/claude-code@${{ matrix.claude }}"
          echo "$RUNNER_TEMP/claude-host/node_modules/.bin" >> "$GITHUB_PATH"
          npm ci --prefix mods/statusline-native --ignore-scripts --no-audit --no-fund
          npm ci --prefix mods/statusline-runtime --ignore-scripts --no-audit --no-fund
          python -m pip install .
          npm ci --ignore-scripts --no-audit --no-fund
      # 2.1.296 loads/tests Mods but no longer emits the declaration file here.
      # Retain exact-build type coverage on every earlier fixed host.
      - name: Generate exact-build official declarations
        if: matrix.claude != '2.1.296'
        run: python tools/prepare_mod_types.py
      - name: Shared protocol contracts
        run: |
          python tools/generate_unicode.py --check
          python tools/generate_ui_contracts.py --check
          python tools/generate_i18n.py --check
          python tools/generate_editor_fixtures.py --check
          python tools/generate_runtime_contracts.py --check
          python -m unittest tests.config.test_catalog tests.ui.test_protocol tests.ui.test_apply_protocol tests.integration.test_native_installer tests.integration.test_runtime_installer tests.runtime.live.test_protocol tests.runtime.live.test_store
      - name: Official static validation
        run: claude plugin validate --strict mods/statusline-native
      - name: Official Mod tests
        run: claude plugin test mods/statusline-native
      - name: TypeScript checks
        if: matrix.claude != '2.1.296'
        run: npm run --prefix mods/statusline-native typecheck
      - name: Official installation and backend bridge
        run: python tools/native_install_smoke.py --report "$RUNNER_TEMP/native-installation.json"
      - name: Independent runtime Mod and installation
        if: matrix.claude == '2.1.289' || matrix.claude == '2.1.294' || matrix.claude == '2.1.296'
        run: |
          if [[ "${{ matrix.claude }}" != "2.1.296" ]]; then
            python tools/prepare_mod_types.py --plugin mods/statusline-runtime
          fi
          claude plugin validate --strict mods/statusline-runtime
          claude plugin test mods/statusline-runtime
          if [[ "${{ matrix.claude }}" != "2.1.296" ]]; then
            npm run --prefix mods/statusline-runtime typecheck
          fi
          python tools/runtime_install_smoke.py --report "$RUNNER_TEMP/runtime-installation.json"
      - name: Installed TypeScript candidate with the fixed official host
        run: npm run migration:official:ts04 -- "$RUNNER_TEMP/ts04-official-installed.json"
      - name: Upload native installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.claude }}
          path: |
            ${{ runner.temp }}/native-installation.json
            ${{ runner.temp }}/runtime-installation.json
            ${{ runner.temp }}/ts04-official-installed.json
          if-no-files-found: error
