name: CI

on:
  push:
    branches: [main]
    tags: ['v3.*']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      validation:
        description: Explicit full validation or isolated diagnostics (never PR or release evidence)
        type: choice
        options: [full, promotion-shadow, windows-probe, macos-probe, windows-source-probe]
        default: full

permissions:
  contents: read

concurrency:
  group: ts06-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: Classify and check documentation
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_checked: ${{ steps.documentation.outputs.docs_checked }}
      draft: ${{ steps.scope.outputs.draft }}
      route: ${{ steps.promotion.outputs.route }}
      promotion_route: ${{ steps.promotion.outputs.promotion_route }}
      mode: ${{ steps.promotion.outputs.mode }}
      source_run: ${{ steps.promotion.outputs.source_run }}
      source_commit: ${{ steps.promotion.outputs.source_commit }}
      filename: ${{ steps.promotion.outputs.filename }}
      artifact_ids: ${{ steps.promotion.outputs.artifact_ids }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check workflow Action identities
        run: node tools/checks/actions.ts
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF_TYPE: ${{ github.ref_type }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: node tools/checks/ci-scope.ts
      - id: promotion
        name: Select full acceptance or verified source promotion
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF_TYPE: ${{ github.ref_type }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_VALIDATION: ${{ inputs.validation }}
          CI_DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
        run: node tools/checks/ci-promotion.ts select --output "$RUNNER_TEMP/promotion-selection.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.promotion.outputs.promotion_route != ''
        with:
          name: ci-promotion-selection
          path: ${{ runner.temp }}/promotion-selection.json
          if-no-files-found: error
          retention-days: 30
      - id: documentation
        if: steps.scope.outputs.docs_only == 'true'
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run docs:check
          git diff --check "$CI_BASE" HEAD
          echo "docs_checked=true" >> "$GITHUB_OUTPUT"

  quick:
    name: Draft quick checks
    needs: scope
    if: needs.scope.outputs.draft == 'true' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  development:
    name: Development checks and portable test outputs
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true' && inputs.validation != 'windows-probe' && inputs.validation != 'macos-probe' && inputs.validation != 'windows-source-probe' && needs.scope.outputs.route == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Bind portable compiled tests to this source
        run: node dist/typescript/tools/build/test-bundle.js create "$RUNNER_TEMP/compiled-tests"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-compiled-tests
          path: ${{ runner.temp }}/compiled-tests/
          if-no-files-found: error
          retention-days: 30

  candidate:
    name: Reproducible public package
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true' && inputs.validation != 'macos-probe' && inputs.validation != 'windows-source-probe' && needs.scope.outputs.route == 'full'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      filename: ${{ steps.identity.outputs.filename }}
      runtime_matrix: ${{ steps.runtimes.outputs.runtime_matrix }}
      shared_runtimes: ${{ steps.runtimes.outputs.shared_runtimes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Require version tags to match application identity
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { VERSION } from './packages/core/dist/src/release.js';
          if (process.env.RELEASE_TAG !== 'v' + VERSION) throw new Error('Release tag/version mismatch');
          JS
      - id: historical-key
        name: Identify immutable historical cache
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { HISTORICAL_RELEASES } from './dist/typescript/tools/acceptance/historical-releases.js';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'key=historical-v1-' + Object.values(HISTORICAL_RELEASES).join('-') + '\n');
          JS
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ steps.historical-key.outputs.key }}
          path: ${{ runner.temp }}/historical
      - name: Prepare checksum-pinned historical inputs once
        run: node dist/typescript/tools/acceptance/historical-inputs.js "$RUNNER_TEMP/historical"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-historical-inputs
          path: ${{ runner.temp }}/historical/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Two independent builds from one immutable commit
        run: npm run release:build -- --commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/candidate"
      - id: runtimes
        name: Freeze runtime selectors once for this candidate
        run: node tools/checks/runtime-inputs.ts "$RUNNER_TEMP/candidate/runtime-inputs.json"
      - id: identity
        name: Record immutable artifact identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/candidate/build-manifest.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${manifest.commit}\nfilename=${manifest.candidate.file}\n`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts06-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  installed:
    name: Installed / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: [candidate, development]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: x64, host_arch: arm64 }
          - { os: macos-14, arch: arm64 }
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-26, arch: arm64 }
          - { os: macos-26-intel, arch: x64 }
    env:
      TS05_TARGET: ${{ matrix.os }}-${{ matrix.arch }}
      TS03_EXPECT_PROCESS_ARCH: ${{ matrix.arch }}
      TS03_EXPECT_HOST_ARCH: ${{ matrix.host_arch || matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts06-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-historical-inputs
          path: ${{ runner.temp }}/historical
      - name: Select verified historical inputs
        run: |
          echo "TS06_LEGACY_370_ARTIFACT=$RUNNER_TEMP/historical/claude-code-statusline-3.7.0.tgz" >> "$GITHUB_ENV"
          echo "TS06_LEGACY_380_ARTIFACT=$RUNNER_TEMP/historical/claude-code-statusline-3.8.0.tgz" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-compiled-tests
          path: ${{ runner.temp }}/compiled-tests
      - name: Restore verified portable test outputs
        run: node tools/build/test-bundle.ts restore "$RUNNER_TEMP/compiled-tests"
      - name: Install the shared artifact offline with empty cache and scripts disabled
        run: node dist/typescript/tools/acceptance/installed.js --artifact "$RUNNER_TEMP/candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --report "$RUNNER_TEMP/evidence/installed.json"
      - name: Native platform, process, failure and terminal tests without Python
        run: node dist/typescript/tools/checks/all.js --platform --report "$RUNNER_TEMP/evidence/source-tests.json"
      - name: Record runtime obligations sharing this exact execution
        env:
          SHARED_RUNTIME_CASES: ${{ needs.candidate.outputs.shared_runtimes }}
        run: node dist/typescript/tools/acceptance/runtime-shared.js "$RUNNER_TEMP/evidence" "$SHARED_RUNTIME_CASES"
      - name: Bind platform and runtime evidence
        run: npm run migration:receipt -- "$RUNNER_TEMP/evidence/platform.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ts06-installed-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  runtime:
    name: Node ${{ matrix.node }} / ${{ matrix.target.os }} / ${{ matrix.target.arch }}
    needs: [candidate, development]
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.runtime_matrix) }}
    env:
      TS06_RESOLVED_NODE: ${{ matrix.version }}
      TS05_TARGET: ${{ matrix.target.os }}-${{ matrix.target.arch }}
      TS03_EXPECT_PROCESS_ARCH: ${{ matrix.target.arch }}
      TS03_EXPECT_HOST_ARCH: ${{ matrix.target.host_arch || matrix.target.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.target.arch }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-compiled-tests
          path: ${{ runner.temp }}/compiled-tests
      - name: Restore verified portable test outputs
        run: node tools/build/test-bundle.ts restore "$RUNNER_TEMP/compiled-tests"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts06-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-historical-inputs
          path: ${{ runner.temp }}/historical
      - name: Select verified historical inputs
        run: |
          echo "TS06_LEGACY_370_ARTIFACT=$RUNNER_TEMP/historical/claude-code-statusline-3.7.0.tgz" >> "$GITHUB_ENV"
          echo "TS06_LEGACY_380_ARTIFACT=$RUNNER_TEMP/historical/claude-code-statusline-3.8.0.tgz" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.version }}
          architecture: ${{ matrix.target.arch }}
      - name: Product tests and isolated offline installation on the selected Node
        run: node dist/typescript/tools/acceptance/runtime.js --case "${{ matrix.node }}" --artifact "$RUNNER_TEMP/candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --report "$RUNNER_TEMP/evidence/runtime.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ts06-runtime-${{ matrix.target.os }}-${{ matrix.target.arch }}-${{ matrix.node }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  mods:
    name: Mods / ${{ matrix.os }} / Claude ${{ matrix.claude }}
    needs: [candidate, development]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, claude: '2.1.287' }
          - { os: ubuntu-24.04, claude: '2.1.288' }
          - { os: ubuntu-24.04, claude: '2.1.289' }
          - { os: ubuntu-24.04, claude: '2.1.294' }
          - { os: ubuntu-24.04, claude: '2.1.296' }
          - { os: ubuntu-24.04, claude: '2.1.310' }
          - { os: windows-2025, claude: '2.1.288' }
          - { os: windows-2025, claude: '2.1.289' }
          - { os: windows-2025, claude: '2.1.294' }
          - { os: windows-2025, claude: '2.1.296' }
          - { os: windows-2025, claude: '2.1.310' }
          - { os: macos-15, claude: '2.1.288' }
          - { os: macos-15, claude: '2.1.289' }
          - { os: macos-15, claude: '2.1.294' }
          - { os: macos-15, claude: '2.1.296' }
          - { os: macos-15, claude: '2.1.310' }
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts06-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-historical-inputs
          path: ${{ runner.temp }}/historical
      - name: Select verified historical inputs
        run: |
          echo "TS06_LEGACY_370_ARTIFACT=$RUNNER_TEMP/historical/claude-code-statusline-3.7.0.tgz" >> "$GITHUB_ENV"
          echo "TS06_LEGACY_380_ARTIFACT=$RUNNER_TEMP/historical/claude-code-statusline-3.8.0.tgz" >> "$GITHUB_ENV"
      - name: Install the fixed host and development dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # These runners use native Node and glibc on Linux. Make the selected
          # binary required: npm may otherwise silently omit a failed optional download.
          claude_native=$(node -p "'@anthropic-ai/claude-code-' + process.platform + '-' + process.arch")
          npm install --prefix "$RUNNER_TEMP/claude-host" --ignore-scripts --no-audit --no-fund "@anthropic-ai/claude-code@${{ matrix.claude }}" "$claude_native@${{ matrix.claude }}"
          # The official wrapper needs its Node-only native-binary placement step.
          # Candidate installation itself always keeps all lifecycle scripts disabled.
          node "$RUNNER_TEMP/claude-host/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/claude-host/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-compiled-tests
          path: ${{ runner.temp }}/compiled-tests
      - name: Restore verified portable test outputs
        run: node tools/build/test-bundle.ts restore "$RUNNER_TEMP/compiled-tests"
      - name: Repeat the unchanged native long scenario ten times
        if: matrix.os == 'windows-2025' && (matrix.claude == '2.1.289' || matrix.claude == '2.1.294')
        run: node dist/typescript/tools/acceptance/native-stability.js "$RUNNER_TEMP/evidence/native-stability.json"
      - name: Official Mod tests, available exact-build types and installed binding
        run: node dist/typescript/tools/acceptance/mods.js --artifact "$RUNNER_TEMP/candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --report "$RUNNER_TEMP/evidence/mods.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ts06-mods-${{ matrix.os }}-${{ matrix.claude }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual validation (not PR evidence)' || 'Complete candidate evidence' }}
    needs: [scope, quick, development, candidate, installed, runtime, mods, integration, promotion]
    if: always() && inputs.validation != 'windows-probe' && inputs.validation != 'macos-probe' && inputs.validation != 'windows-source-probe'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Require successful documentation or complete product checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF_TYPE: ${{ github.ref_type }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_VALIDATION: ${{ inputs.validation }}
        run: node tools/checks/ci-scope.ts gate
      - if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.route == 'full'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: evidence
        name: Select immutable artifacts from successful attempts
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.route == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/checks/ci-evidence.ts select --run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/evidence-selection.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.route == 'full'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.evidence.outputs.artifact_ids }}
          path: ${{ runner.temp }}/evidence
      - name: Restore verified portable test outputs
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.route == 'full'
        run: node tools/build/test-bundle.ts restore "$RUNNER_TEMP/evidence/ci-compiled-tests"
      - name: Require eight targets, sixteen hosts and all 32 runtime cases for the same artifact
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.route == 'full'
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          release_channel=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/evidence/ts06-candidate/build-manifest.json')).channel")
          node dist/typescript/tools/release/prepare.js --"$release_channel" --artifact "$RUNNER_TEMP/evidence/ts06-candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --evidence "$RUNNER_TEMP/evidence" --report "$RUNNER_TEMP/acceptance/candidate-acceptance.json"
      - name: Bind complete acceptance to its original source and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.route == 'full' && github.event_name != 'workflow_dispatch'
        run: node dist/typescript/tools/checks/ci-evidence.js record --evidence "$RUNNER_TEMP/evidence" --selection "$RUNNER_TEMP/evidence-selection.json" --acceptance "$RUNNER_TEMP/acceptance/candidate-acceptance.json" --output "$RUNNER_TEMP/acceptance/ci-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.route == 'full'
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'ci-manual-acceptance' || 'ts06-acceptance' }}
          path: ${{ runner.temp }}/acceptance/
          if-no-files-found: error
          retention-days: 30

  windows-probe:
    name: Windows supervisor and installed diagnostics / ${{ matrix.os }}
    needs: candidate
    if: inputs.validation == 'windows-probe'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          architecture: x64
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts06-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-historical-inputs
          path: ${{ runner.temp }}/historical
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify actual native process boundaries
        run: node --test packages/platform/dist/test/source-process.test.js
      - name: Diagnose installed console entries before the long version profile
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          node dist/typescript/tools/acceptance/installed.js --artifact "$RUNNER_TEMP/candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --report "$RUNNER_TEMP/probe/editor-console.json" --diagnostic-pattern 'installed terminal policy|installed external editor' > "$RUNNER_TEMP/probe/editor-console.log" 2>&1 || { cat "$RUNNER_TEMP/probe/editor-console.log"; exit 1; }
      - name: Compare identical supervisor workloads
        run: node dist/typescript/tools/benchmarks/windows-supervisor.js "$RUNNER_TEMP/probe/supervisor.json"
      - name: Profile real installed upgrade and recovery
        env:
          TS06_PROFILE_MANAGEMENT: '1'
          TS06_LEGACY_370_ARTIFACT: ${{ runner.temp }}/historical/claude-code-statusline-3.7.0.tgz
          TS06_LEGACY_380_ARTIFACT: ${{ runner.temp }}/historical/claude-code-statusline-3.8.0.tgz
        run: node dist/typescript/tools/acceptance/installed.js --artifact "$RUNNER_TEMP/candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --report "$RUNNER_TEMP/probe/installed.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/probe/
          if-no-files-found: error
          retention-days: 30

  macos-probe:
    name: macOS native process identity / ${{ matrix.os }}
    needs: scope
    if: inputs.validation == 'macos-probe'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.0.0'
      - name: Compare actual kernel identity with the historical format
        run: node --test packages/platform/dist/test/processes.test.js
      - name: Repeat the affected six-language transaction scenario twenty times
        run: |
          mkdir -p "$RUNNER_TEMP/macos-probe"
          for round in {1..20}; do
            node --test packages/cli/dist/test/sources-editor.test.js > "$RUNNER_TEMP/macos-probe/round-$round.log" 2>&1 || { cat "$RUNNER_TEMP/macos-probe/round-$round.log"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/macos-probe/
          if-no-files-found: error
          retention-days: 30

  windows-source-probe:
    name: Windows source stability / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: scope
    if: inputs.validation == 'windows-source-probe'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, node: '24.0.0' }
          - { os: windows-11-arm, node: '24.0.0' }
          - { os: windows-11-arm, node: '22.23.4' }
          - { os: windows-11-arm, node: '24.21.0' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          architecture: x64
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
      - name: Prepare system PowerShell for source-only diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/source-probe"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { prepareWindowsPowerShell } from './dist/typescript/tools/acceptance/windows-shell.js';
          const result = prepareWindowsPowerShell();
          writeFileSync(join(process.env.RUNNER_TEMP, 'source-probe', 'shell-setup.json'), JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          if (result.status !== 'pass') process.exit(1);
          JS
      - name: Run unchanged source assertions with resource-sensitive Git tests serialized
        run: |
          mkdir -p "$RUNNER_TEMP/source-probe"
          for round in {1..20}; do
            node --test --test-name-pattern 'protected cleanup retains' packages/cli/dist/test/package-management.test.js > "$RUNNER_TEMP/source-probe/package-cleanup-$round.log" 2>&1 || { cat "$RUNNER_TEMP/source-probe/package-cleanup-$round.log"; exit 1; }
          done
          node tools/typescript/test.mjs --runtime > "$RUNNER_TEMP/source-probe/runtime.log" 2>&1 || { cat "$RUNNER_TEMP/source-probe/runtime.log"; exit 1; }
          for round in {1..10}; do
            node --test packages/cli/dist/test/git.test.js > "$RUNNER_TEMP/source-probe/git-$round.log" 2>&1 || { cat "$RUNNER_TEMP/source-probe/git-$round.log"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-source-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/source-probe/
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Integration smoke / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.promotion_route == 'main'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-promotion-selection
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.scope.outputs.source_run }}
          artifact-ids: ${{ needs.scope.outputs.artifact_ids }}
          path: ${{ runner.temp }}/evidence
      - name: Verify source and original bytes before running integration tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/checks/ci-promotion.ts preflight --selection "$RUNNER_TEMP/selection/promotion-selection.json" --evidence "$RUNNER_TEMP/evidence"
      - run: node tools/build/test-bundle.ts restore "$RUNNER_TEMP/evidence/ci-compiled-tests" "${{ needs.scope.outputs.source_commit }}"
      - name: Install original PR package and exercise critical commands
        run: node dist/typescript/tools/acceptance/integration-smoke.js --artifact "$RUNNER_TEMP/evidence/ts06-candidate/${{ needs.scope.outputs.filename }}" --source "${{ needs.scope.outputs.source_commit }}" --integration "$GITHUB_SHA" --target "${{ matrix.os }}" --report "$RUNNER_TEMP/smoke/smoke.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-integration-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: error
          retention-days: 30

  promotion:
    name: Verify accepted release bytes
    needs: [scope, integration]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.promotion_route != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-promotion-selection
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.scope.outputs.source_run }}
          artifact-ids: ${{ needs.scope.outputs.artifact_ids }}
          path: ${{ runner.temp }}/evidence
      - name: Check original bytes before restoring executable test outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/checks/ci-promotion.ts preflight --selection "$RUNNER_TEMP/selection/promotion-selection.json" --evidence "$RUNNER_TEMP/evidence"
      - name: Independently verify with the accepted first-parent code
        if: needs.scope.outputs.promotion_route == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/checks/ci-trust.ts --selection "$RUNNER_TEMP/selection/promotion-selection.json" --evidence "$RUNNER_TEMP/evidence" --output "$RUNNER_TEMP/promotion/trusted-verification.json"
      - run: node tools/build/test-bundle.ts restore "$RUNNER_TEMP/evidence/ci-compiled-tests" "${{ needs.scope.outputs.source_commit }}"
      - name: Exercise main, tag, npm provenance and workflow routing contracts
        run: node --test --test-concurrency=1 dist/typescript/tools/checks/test/ci-{evidence,integration,routing,scope,trust}.test.js
      - id: smokes
        if: needs.scope.outputs.promotion_route == 'main'
        name: Select exact original integration receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/checks/ci-integration.ts --run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/smoke-selection.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.scope.outputs.promotion_route == 'main'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.smokes.outputs.artifact_ids }}
          path: ${{ runner.temp }}/smokes
      - name: Verify the original package, receipts, main ancestry and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dist/typescript/tools/checks/ci-promotion.js verify --selection "$RUNNER_TEMP/selection/promotion-selection.json" --evidence "$RUNNER_TEMP/evidence" --smokes "$RUNNER_TEMP/smokes" --smoke-selection "$RUNNER_TEMP/smoke-selection.json" --trusted-verification "$RUNNER_TEMP/promotion/trusted-verification.json" --output "$RUNNER_TEMP/promotion/promotion.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-promotion
          path: ${{ runner.temp }}/promotion/
          if-no-files-found: error
          retention-days: 30
