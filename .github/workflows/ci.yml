name: Windows package copy diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    name: Copy cleanup / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        node: ['24.0.0', '22.x']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          architecture: x64
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
      - run: node --test packages/platform/dist/test/package-copy.test.js packages/platform/dist/test/remove-tree.test.js
      - run: node tools/testing/windows-copy-cleanup-diagnostic.mjs
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-copy-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/copy-diagnostic/
          if-no-files-found: error
