name: Release CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Release diagnostic {0}', github.sha) ||
      github.event_name == 'push' && format('Release tag {0} {1}', github.ref_name, github.sha) ||
      github.event.action == 'closed' && format('Release main #{0} {1}', github.event.number, github.event.pull_request.merge_commit_sha) ||
      format('Release PR #{0} {1}', github.event.number, github.event.pull_request.head.sha) }}

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  push:
    tags: ['v3.*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' && 'main' || 'source' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build release candidate
    if: >-
      github.repository == 'fbincon/claude-code-statusline' &&
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' ||
       github.event_name == 'pull_request' && github.event.action != 'closed' &&
       !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      version: ${{ steps.build.outputs.version }}
      filename: ${{ steps.build.outputs.filename }}
      package_id: ${{ steps.package.outputs.artifact-id }}
      delivery: ${{ steps.build.outputs.delivery }}
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - &development-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          architecture: ${{ env.DEVELOPMENT_ARCH || 'x64' }}
          cache: npm
      - &dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - id: build
        name: Build and reproduce the release files from Git and the source archive
        run: node dist/typescript/tools/checks/release-ci-workflow.js build --directory "$RUNNER_TEMP/delivery"
      - id: package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-delivery
          path: |
            ${{ runner.temp }}/delivery/${{ steps.build.outputs.filename }}
            ${{ runner.temp }}/delivery/${{ steps.build.outputs.source_archive }}
            ${{ runner.temp }}/delivery/build-manifest.json
            ${{ runner.temp }}/delivery/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record the build and uploaded package identity
        env:
          DELIVERY_HASHES: ${{ steps.build.outputs.delivery }}
          PACKAGE_ID: ${{ steps.package.outputs.artifact-id }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: node tools/checks/release-ci-workflow.ts build-receipt --file "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-build
          path: ${{ runner.temp }}/receipt/receipt.json
          if-no-files-found: error
          retention-days: 30

  candidate-check:
    name: ${{ matrix.job }}
    needs: build
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PACKAGE_RUN: ${{ github.run_id }}
      PACKAGE_ID: ${{ needs.build.outputs.package_id }}
      PACKAGE_FILE: ${{ needs.build.outputs.filename }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      DELIVERY_HASHES: ${{ needs.build.outputs.delivery }}
      RELEASE_CASE: ${{ matrix.id }}
      DEVELOPMENT_ARCH: ${{ matrix.arch }}
      HOST_VERSION: ${{ matrix.host }}
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - *checkout
      - *development-node
      - *dependencies
      - &download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.PACKAGE_RUN }}
          artifact-ids: ${{ env.PACKAGE_ID }}
          path: ${{ runner.temp }}/delivery
          merge-multiple: true
      - &verify-files
        name: Verify the original delivery bytes
        run: node tools/checks/release-ci-workflow.ts verify-files --directory "$RUNNER_TEMP/delivery"
      - &compile
        run: npm run build
      - if: matrix.kind == 'package'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - if: matrix.kind == 'package'
        name: Install, configure, render and uninstall the original package
        run: &smoke >-
          node dist/typescript/tools/acceptance/integration-smoke.js --release-smoke
          --artifact "$RUNNER_TEMP/delivery/$PACKAGE_FILE" --source "$SOURCE_SHA" --integration "$CHECKOUT_SHA"
          --target "$RELEASE_CASE" --report "$RUNNER_TEMP/receipt/receipt.json"
      - if: matrix.kind == 'host'
        name: Install the pinned official host in an isolated prefix
        run: |
          claude_native=$(node -p "'@anthropic-ai/claude-code-' + process.platform + '-' + process.arch")
          npm install --prefix "$RUNNER_TEMP/claude-host" --ignore-scripts --no-audit --no-fund "@anthropic-ai/claude-code@$HOST_VERSION" "$claude_native@$HOST_VERSION"
          node "$RUNNER_TEMP/claude-host/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/claude-host/node_modules/.bin" >> "$GITHUB_PATH"
      - if: matrix.kind == 'host'
        name: Validate and load the installed Mods on the official host
        env:
          TS05_PHYSICAL_EXPECT_HOST: ${{ env.HOST_VERSION }}
        run: >-
          node dist/typescript/tools/acceptance/mods.js --release-smoke
          --artifact "$RUNNER_TEMP/delivery/$PACKAGE_FILE" --commit "$SOURCE_SHA" --report "$RUNNER_TEMP/receipt/receipt.json"
      - &smoke-receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
      - &failed-smoke
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-failure
          path: ${{ runner.temp }}/receipt/
          retention-days: 30

  candidate-evidence:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Verify release smoke diagnostic' || 'Accept release candidate' }}
    needs: [build, candidate-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - *checkout
      - *development-node
      - run: node tools/checks/release-ci-workflow.ts candidate --file "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'ci-release-diagnostic' || 'ci-release-accepted' }}
          path: ${{ runner.temp }}/receipt/receipt.json
          if-no-files-found: error
          retention-days: 30

  main-select:
    name: Verify release merge
    if: >-
      github.repository == 'fbincon/claude-code-statusline' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      source: ${{ steps.select.outputs.source }}
      version: ${{ steps.select.outputs.version }}
      filename: ${{ steps.select.outputs.filename }}
      run_id: ${{ steps.select.outputs.run_id }}
      package_id: ${{ steps.select.outputs.package_id }}
      delivery: ${{ steps.select.outputs.delivery }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - *checkout
      - *development-node
      - id: select
        name: Use the integrated first parent to verify the PR evidence
        run: node tools/checks/release-ci-workflow.ts main-select --file "$RUNNER_TEMP/selection.json"
      - &download-selected
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.run_id }}
          artifact-ids: ${{ steps.select.outputs.package_id }}
          path: ${{ runner.temp }}/delivery
          merge-multiple: true
      - name: Verify original package bytes with the first-parent verifier
        run: >-
          node tools/checks/release-ci-workflow.ts main-preflight --selection "$RUNNER_TEMP/selection.json"
          --directory "$RUNNER_TEMP/delivery" --file "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-preflight
          path: ${{ runner.temp }}/receipt/receipt.json
          if-no-files-found: error
          retention-days: 30

  main-smoke:
    name: ${{ matrix.job }}
    needs: main-select
    if: needs.main-select.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.main-select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      SOURCE_SHA: ${{ needs.main-select.outputs.source }}
      PACKAGE_RUN: ${{ needs.main-select.outputs.run_id }}
      PACKAGE_ID: ${{ needs.main-select.outputs.package_id }}
      PACKAGE_FILE: ${{ needs.main-select.outputs.filename }}
      RELEASE_VERSION: ${{ needs.main-select.outputs.version }}
      DELIVERY_HASHES: ${{ needs.main-select.outputs.delivery }}
      RELEASE_CASE: ${{ matrix.id }}
      DEVELOPMENT_ARCH: ${{ matrix.arch }}
    steps:
      - *checkout
      - *development-node
      - *download
      - *verify-files
      - *dependencies
      - *compile
      - name: Exercise the original package after the verified merge
        run: *smoke
      - *smoke-receipt
      - *failed-smoke

  main-evidence:
    name: Accept release integration
    needs: [main-select, main-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - *checkout
      - *development-node
      - run: node tools/checks/release-ci-workflow.ts main-accept --file "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-integrated
          path: ${{ runner.temp }}/receipt/receipt.json
          if-no-files-found: error
          retention-days: 30

  tag:
    name: Verify release tag
    if: github.repository == 'fbincon/claude-code-statusline' && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECKOUT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - *checkout
      - *development-node
      - id: select
        name: Verify the tag and the original PR and merge evidence
        run: node tools/checks/release-ci-workflow.ts tag-select --file "$RUNNER_TEMP/selection.json"
      - *download-selected
      - *dependencies
      - *compile
      - name: Verify the four original release files and bind the tag
        run: >-
          node dist/typescript/tools/checks/release-ci-workflow.js tag-accept --selection "$RUNNER_TEMP/selection.json"
          --directory "$RUNNER_TEMP/delivery" --file "$RUNNER_TEMP/receipt/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-tag
          path: ${{ runner.temp }}/receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
