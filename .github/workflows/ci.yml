name: Windows version operation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    name: Version commands / ${{ matrix.os }} / Claude ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, host: '2.1.288'}
          - {os: windows-2025, host: '2.1.289'}
          - {os: windows-11-arm, host: '2.1.288'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ts06-candidate
          run-id: 40084425356
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: |
          npm install --prefix "$RUNNER_TEMP/claude-host" --ignore-scripts --no-audit --no-fund '@anthropic-ai/claude-code@${{ matrix.host }}' '@anthropic-ai/claude-code-win32-x64@${{ matrix.host }}'
          node "$RUNNER_TEMP/claude-host/node_modules/@anthropic-ai/claude-code/install.cjs"
      - run: node tools/testing/windows-version-diagnostic.mjs
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}
          DIAGNOSTIC_HOST: ${{ matrix.host }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-version-${{ matrix.os }}-${{ matrix.host }}
          path: ${{ runner.temp }}/version-diagnostic/
          if-no-files-found: error
