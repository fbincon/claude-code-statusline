name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15, macos-26-intel, macos-26]
        python: ["3.10", "3.14"]
        include:
          - os: macos-15
            python: "3.10"
            architecture: arm64
            python_spec: "3.10.11"
          - os: macos-15
            python: "3.14"
            architecture: arm64
          - os: macos-26
            python: "3.10"
            architecture: arm64
            python_spec: "3.10.11"
          - os: macos-26
            python: "3.14"
            architecture: arm64

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      STATUSLINE_EXPECTED_ARCH: ${{ matrix.architecture || 'x64' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_spec || matrix.python }}
          architecture: ${{ matrix.architecture || 'x64' }}
      - name: Prepare POSIX terminal integration prerequisites
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install tmux
            else
              sudo -n apt-get update
              sudo -n apt-get install -y tmux
            fi
          fi
          tmux -V
          python -c "import curses, platform; assert curses.wrapper; print(platform.platform()); print(platform.python_version()); print(platform.machine())"
      - name: Install from package metadata
        run: python -m pip install . ruff
      - name: Verify Windows curses backend
        if: runner.os == 'Windows'
        run: python -c "import curses, importlib.metadata as m; assert m.version('windows-curses') >= '2.4.2'; assert curses.wrapper"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Ruff fatal and syntax checks
        run: ruff check --select F,E9 src tests
      - name: PowerShell command smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "statusline powershell"
          New-Item -ItemType Directory -Force -Path $env:CLAUDE_CONFIG_DIR | Out-Null
          '{"model":{"id":"claude-ci"},"workspace":{"current_dir":"C:\\ci"},"context_window":{"remaining_percentage":50,"context_window_size":200000}}' | claude-statusline.exe render
      - name: Git Bash command smoke
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/statusline git bash"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          printf '%s' '{"model":{"id":"claude-ci"},"workspace":{"current_dir":"C:\\ci"},"context_window":{"remaining_percentage":50,"context_window_size":200000}}' | claude-statusline.exe render
      - name: POSIX installed CLI and native adapter smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python tests/ci_smoke.py --report "$RUNNER_TEMP/statusline-validation.json"
      - name: Upload platform validation report
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/statusline-validation.json
          if-no-files-found: error

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - name: Inspect wheel and sdist contents
        shell: bash
        run: |
          python - <<'PY'
          import email
          import glob
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")
          sdist = glob.glob("dist/*.tar.gz")
          assert len(wheel) == len(sdist) == 1
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
              assert metadata["Version"] == "1.1.0"
              assert "Operating System :: MacOS :: MacOS X" in metadata.get_all("Classifier", [])
              requirements = metadata.get_all("Requires-Dist", [])
              assert any("windows-curses>=2.4.2" in value and "win32" in value for value in requirements)
              for suffix in (
                  "claude_statusline/_platform.py",
                  "claude_statusline/macos_terminal.py",
                  "claude_statusline/resources/statusline-config/SKILL.md",
                  "claude_statusline/resources/statusline-configure/SKILL.md",
              ):
                  assert any(name.endswith(suffix) for name in names), suffix
          with tarfile.open(sdist[0], "r:gz") as archive:
              names = set(archive.getnames())
              for suffix in (
                  "src/claude_statusline/_platform.py",
                  "src/claude_statusline/macos_terminal.py",
                  "src/claude_statusline/resources/statusline-config/SKILL.md",
                  "src/claude_statusline/resources/statusline-configure/SKILL.md",
                  "docs/MACOS_VALIDATION.md",
                  "docs/images/README.md",
              ):
                  assert any(name.endswith(suffix) for name in names), suffix
              for image in Path("docs/images").rglob("*.png"):
                  suffix = image.as_posix()
                  assert any(name.endswith(suffix) for name in names), suffix
          PY
