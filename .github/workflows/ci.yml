name: Windows real shell preview diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    name: Preview shells / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        node: ['22.0.0', '24.0.0']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ts06-candidate
          run-id: 40084425356
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
      - run: node --test --test-name-pattern='installed terminal policy' dist/typescript/tools/migration/ts-04/test/installed.test.js
        env:
          TS05_CANDIDATE_ARTIFACT: ${{ runner.temp }}/candidate/fbincon-claude-code-statusline-3.8.0.tgz
          TS05_CANDIDATE_COMMIT: e3029feed60d67ff7f2ccc1ac6e22bf6aa588a19
          TS04_INSTALLED_REPORT: ${{ runner.temp }}/console-diagnostic/installed.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-console-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/console-diagnostic/
          if-no-files-found: error
