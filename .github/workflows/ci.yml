name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  candidate:
    name: Reproducible universal candidate
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      filename: ${{ steps.identity.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Python-free development checks and complete responsibility ledger
        run: npm run check
      - name: Two independent builds from one immutable commit
        run: npm run candidate:build -- --commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/candidate"
      - id: identity
        name: Record immutable artifact identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/candidate/build-manifest.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${manifest.commit}\nfilename=${manifest.candidate.file}\n`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: ts05-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  installed:
    name: Installed / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: x64, host_arch: arm64 }
          - { os: macos-14, arch: arm64 }
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-26, arch: arm64 }
          - { os: macos-26-intel, arch: x64 }
    env:
      TS05_TARGET: ${{ matrix.os }}-${{ matrix.arch }}
      TS03_EXPECT_PROCESS_ARCH: ${{ matrix.arch }}
      TS03_EXPECT_HOST_ARCH: ${{ matrix.host_arch || matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ts05-candidate
          path: ${{ runner.temp }}/candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the shared artifact offline with empty cache and scripts disabled
        run: npm run test:installed -- --artifact "$RUNNER_TEMP/candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --report "$RUNNER_TEMP/evidence/installed.json"
      - name: Native platform, process, failure and terminal tests without Python
        run: npm run check
      - name: Bind platform and runtime evidence
        run: npm run migration:receipt -- "$RUNNER_TEMP/evidence/platform.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts05-installed-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error

  mods:
    name: Mods / ${{ matrix.os }} / Claude ${{ matrix.claude }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, claude: '2.1.287' }
          - { os: ubuntu-24.04, claude: '2.1.288' }
          - { os: ubuntu-24.04, claude: '2.1.289' }
          - { os: ubuntu-24.04, claude: '2.1.294' }
          - { os: ubuntu-24.04, claude: '2.1.296' }
          - { os: windows-2025, claude: '2.1.288' }
          - { os: windows-2025, claude: '2.1.289' }
          - { os: windows-2025, claude: '2.1.294' }
          - { os: windows-2025, claude: '2.1.296' }
          - { os: macos-15, claude: '2.1.288' }
          - { os: macos-15, claude: '2.1.289' }
          - { os: macos-15, claude: '2.1.294' }
          - { os: macos-15, claude: '2.1.296' }
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ts05-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install the fixed host and development dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/claude-host" --ignore-scripts --no-audit --no-fund "@anthropic-ai/claude-code@${{ matrix.claude }}"
          # The official wrapper needs its Node-only native-binary placement step.
          # Candidate installation itself always keeps all lifecycle scripts disabled.
          node "$RUNNER_TEMP/claude-host/node_modules/@anthropic-ai/claude-code/install.cjs"
          echo "$RUNNER_TEMP/claude-host/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Official Mod tests, available exact-build types and installed binding
        run: npm run test:mods -- --artifact "$RUNNER_TEMP/candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --report "$RUNNER_TEMP/evidence/mods.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts05-mods-${{ matrix.os }}-${{ matrix.claude }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error

  acceptance:
    name: Complete candidate evidence
    needs: [candidate, installed, mods]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: ts05-*
          path: ${{ runner.temp }}/evidence
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require all eight targets and thirteen hosts to match the same artifact
        run: npm run release:prepare -- --artifact "$RUNNER_TEMP/evidence/ts05-candidate/${{ needs.candidate.outputs.filename }}" --commit "${{ needs.candidate.outputs.commit }}" --evidence "$RUNNER_TEMP/evidence" --report "$RUNNER_TEMP/candidate-acceptance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ts05-acceptance
          path: ${{ runner.temp }}/candidate-acceptance.json
          if-no-files-found: error
