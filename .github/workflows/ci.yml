name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15, macos-26-intel, macos-26]
        python: ["3.10", "3.14"]
        include:
          - os: macos-15
            python: "3.10"
            architecture: arm64
            python_spec: "3.10.11"
          - os: macos-15
            python: "3.14"
            architecture: arm64
          - os: macos-26
            python: "3.10"
            architecture: arm64
            python_spec: "3.10.11"
          - os: macos-26
            python: "3.14"
            architecture: arm64

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      STATUSLINE_EXPECTED_ARCH: ${{ matrix.architecture || 'x64' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_spec || matrix.python }}
          architecture: ${{ matrix.architecture || 'x64' }}
      - name: Prepare POSIX terminal integration prerequisites
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install tmux
            else
              sudo -n apt-get update
              sudo -n apt-get install -y tmux
            fi
          fi
          tmux -V
          python -c "import curses, platform; assert curses.wrapper; print(platform.platform()); print(platform.python_version()); print(platform.machine())"
      - name: Install from package metadata
        run: python -m pip install . ruff
      - name: Verify Windows curses backend
        if: runner.os == 'Windows'
        run: python -c "import curses, importlib.metadata as m; assert m.version('windows-curses') >= '2.4.2'; assert curses.wrapper"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Shared language resources
        run: python tools/generate_i18n.py --check
      - name: Ruff fatal and syntax checks
        run: ruff check --select F,E9 src tests tools
      - name: PowerShell command smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "statusline powershell"
          New-Item -ItemType Directory -Force -Path $env:CLAUDE_CONFIG_DIR | Out-Null
          '{"model":{"id":"claude-ci"},"workspace":{"current_dir":"C:\\ci"},"context_window":{"remaining_percentage":50,"context_window_size":200000}}' | claude-statusline.exe render
      - name: Git Bash command smoke
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/statusline git bash"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          printf '%s' '{"model":{"id":"claude-ci"},"workspace":{"current_dir":"C:\\ci"},"context_window":{"remaining_percentage":50,"context_window_size":200000}}' | claude-statusline.exe render
      - name: POSIX installed CLI and native adapter smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python tools/ci_smoke.py --report "$RUNNER_TEMP/statusline-validation.json"
      - name: Upload platform validation report
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/statusline-validation.json
          if-no-files-found: error

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build twine 'readme-renderer[md]'
      - name: Validate documentation
        run: python tools/check_docs.py
      - name: Build with local-only exclusion fixtures
        run: |
          python tools/inspect_dist.py --write-exclusion-fixtures
          python -m build
      - name: Inspect wheel and sdist contents
        run: python tools/inspect_dist.py --check-long-description
      - name: Validate PyPI metadata and long description
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
